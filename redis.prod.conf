# =============================================================================
# Redis production config
# Catatan: password & maxmemory sengaja TIDAK ditaruh di sini.
# Keduanya di-inject lewat command-line di docker-compose.prod.yml dari .env
# (command-line arg meng-override file ini), jadi rahasia nggak ke-commit.
# =============================================================================

# --- Network -----------------------------------------------------------------
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
tcp-keepalive 300
timeout 0

# --- Persistence: RDB (snapshot) ---------------------------------------------
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data
stop-writes-on-bgsave-error yes

# --- Persistence: AOF (append-only, lebih tahan crash) -----------------------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# --- Memory (nilai di-override dari env via command) -------------------------
# maxmemory            -> lihat docker-compose.prod.yml
# maxmemory-policy     -> lihat docker-compose.prod.yml

# --- Logging -----------------------------------------------------------------
loglevel notice
logfile ""

# --- Slow log (buat debugging performa) --------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128

# --- Latency monitor ---------------------------------------------------------
latency-monitor-threshold 100

# --- Security tambahan (opsional, buka kalau perlu) --------------------------
# Matikan command berbahaya di prod:
# rename-command FLUSHALL ""
# rename-command FLUSHDB  ""
# rename-command CONFIG   "CONFIG_a8f3c1"
# rename-command KEYS     ""
