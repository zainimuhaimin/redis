# =============================================================================
# DEV override
# - Port di-expose ke semua interface biar gampang diakses dari host / app lokal
# - Password AKTIF (REDIS_PASSWORD_DEV dari .env) biar perilaku mirip prod
# - Logging debug + AOF nyala biar mirip prod tapi ringan
# - Redis Commander (GUI) ikut nyala buat inspect data, sudah pakai password
# =============================================================================

services:
  redis:
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --loglevel debug
      --requirepass ${REDIS_PASSWORD_DEV:?REDIS_PASSWORD_DEV wajib diisi di .env, isi bebas untuk dev}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD_DEV}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ${REDIS_CONTAINER_NAME:-redis}-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD_DEV}
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    networks:
      - redis-net
    depends_on:
      redis:
        condition: service_healthy