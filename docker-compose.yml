# =============================================================================
# Base config - dipakai bareng oleh dev & prod.
# JANGAN dijalankan sendiri. Selalu gabung dengan salah satu override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml  up -d
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (Lebih gampang pakai Makefile: `make dev` / `make prod`)
# =============================================================================

services:
  redis:
    image: redis:7.4-alpine
    container_name: ${REDIS_CONTAINER_NAME:-redis}
    restart: unless-stopped
    networks:
      - redis-net
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  redis-net:
    driver: bridge

volumes:
  redis-data:
    driver: local
